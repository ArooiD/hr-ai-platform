# HR AI Platform - Frontend Nginx Configuration
# Optimized for React SPA with static file serving

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uncomment when HTTPS is enabled permanently
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client max body size
    client_max_body_size 50M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        text/javascript
        application/wasm;
    gzip_disable "msie6";

    # Docker logs
    access_log /dev/stdout;
    error_log /dev/stderr warn;


    # Health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }


    # SPA entry point
    # Always fetch fresh version after deployment
    location = /index.html {
        try_files $uri =404;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }


    # Vite generated assets
    # Files contain hashes and can be cached forever
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";

        gzip_static on;
    }


    # Static resources
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }


    # Fonts
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }


    # Manifest and application icons
    location ~* (manifest|icon|apple-touch).*\.(json|png|ico)$ {
        try_files $uri =404;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }


    # Robots and sitemap
    location ~* ^(robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;

        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }


    # Backend API proxy
    # Enable if frontend and backend share the same domain
    #
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    #
    #     proxy_http_version 1.1;
    #
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }


    # React Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }


    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }


    # Error pages
    error_page 404 /404.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }


    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
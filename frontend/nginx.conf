# HR AI Platform - Frontend Nginx Configuration
# Optimized for React SPA with static file serving

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client max body size
    client_max_body_size 50M;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript application/wasm;
    gzip_disable "msie6";

    # Brotli compression (if module is available)
    # brotli on;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # Logging
    access_log /var/log/nginx/frontend-access.log;
    error_log /var/log/nginx/frontend-error.log;

    # Main SPA location - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache HTML for short time (always fresh)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Static assets with content-based hashing (from Vite build)
    # These can be cached for a long time
    location ~* /assets/ {
        try_files $uri =404;
        
        # Cache for 1 year (files have content hashes in names)
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # Enable gzip for compressed assets
        gzip_static on;
    }

    # JavaScript and CSS files
    location ~* \.(js|css)$ {
        try_files $uri =404;
        
        # Cache for 1 year (Vite adds content hashes)
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # Preload critical assets
        add_header Link "<$uri>; rel=preload; as=$upstream_http_content_type" always;
    }

    # Images
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        try_files $uri =404;
        
        # Cache for 1 year
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fonts
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        try_files $uri =404;
        
        # Cache for 1 year
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Manifest and icons
    location ~* (manifest|icon|apple-touch).*\.(json|png|ico)$ {
        try_files $uri =404;
        
        # Cache for 1 week
        add_header Cache-Control "public, max-age=604800";
    }

    # Robots and sitemap
    location ~* ^(robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
        
        # Cache for 1 day
        add_header Cache-Control "public, max-age=86400";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

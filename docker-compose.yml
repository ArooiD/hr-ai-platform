services:
  backend:
    image: ghcr.io/darap2839/hr-ai-platform/backend:master
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://hradmin:hradmin123@postgres:5432/hr_platform
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: hradmin
      POSTGRES_PASSWORD: hradmin123
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: hradmin
      MINIO_SECRET_KEY: hradmin123
      MINIO_BUCKET: hr-content
      WEAVIATE_URL: http://weaviate:8080
      OLLAMA_BASE_URL: http://ollama:11434
      MINERU_URL: http://mineru:30000
      AUTH_MODE: keycloak
      KEYCLOAK_URL: http://localhost/auth/auth
      KEYCLOAK_REALM: platform
      KEYCLOAK_CLIENT_ID: platform
      JWT_ISSUER: hr-ai
      JWT_SECRET: hr-ai-dev-local-key
      DEMO_USER_LOGIN: depopova
      DEMO_USER_FULL_NAME: Дарья Попова
      DEMO_USER_ROLE: HR business partner
      DEMO_USER_DEPARTMENT: HR
    depends_on:
      - postgres
      - minio
      - qdrant
      - keycloak

  frontend:
    image: ghcr.io/darap2839/hr-ai-platform/frontend:master
    pull_policy: always
    environment:
      VITE_API_URL: ""
      VITE_KEYCLOAK_URL: http://localhost:8080/auth
      VITE_KEYCLOAK_REALM: platform
      VITE_KEYCLOAK_CLIENT_ID: platform
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
      - minio

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: hr_platform
      POSTGRES_USER: hradmin
      POSTGRES_PASSWORD: hradmin123
    volumes:
      - ./data/postgres:/var/lib/postgresql/18/docker
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hradmin -d hr_platform" ]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: keycloak/keycloak:latest
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: hradmin
      KC_DB_PASSWORD: hradmin123
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
#    ports:
#      - "127.0.0.1:8080:8080"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hradmin
      MINIO_ROOT_PASSWORD: hradmin123
    volumes:
      - ./data/minio:/data
    ports:
      - "9001:9001"
      - "9000:9000"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

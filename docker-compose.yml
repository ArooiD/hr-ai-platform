services:
  backend:
    image: python:3.12-slim
    working_dir: /workspace/backend
    volumes:
      - .:/workspace
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python run_migrations.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql://hradmin:hradmin123@postgres:5432/hr_platform
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: hradmin
      POSTGRES_PASSWORD: hradmin123
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: hradmin
      MINIO_SECRET_KEY: hradmin123
      MINIO_BUCKET: hr-content
      WEAVIATE_URL: http://weaviate:8080
      OLLAMA_BASE_URL: http://ollama:11434
      MINERU_URL: http://mineru:30000
      AUTH_MODE: mock
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: hr-ai
      KEYCLOAK_CLIENT_ID: hr-ai-frontend
      JWT_ISSUER: hr-ai-platform
      JWT_SECRET: hr-ai-dev-local-key
      DEMO_USER_LOGIN: depopova
      DEMO_USER_FULL_NAME: Дарья Попова
      DEMO_USER_ROLE: HR business partner
      DEMO_USER_DEPARTMENT: HR
    expose:
      - "8000"
    depends_on:
      - postgres
      - minio
      - qdrant
      - keycloak

  frontend:
    image: node:22
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ""
      VITE_KEYCLOAK_URL: http://localhost:8081
      VITE_KEYCLOAK_REALM: hr-ai
      VITE_KEYCLOAK_CLIENT_ID: hr-ai-frontend
    expose:
      - "5173"
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
      - minio

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hr_platform
      POSTGRES_USER: hradmin
      POSTGRES_PASSWORD: hradmin123
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  keycloak:
    image: keycloak/keycloak:latest
    command: start-dev --http-port=8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: hradmin
      KC_DB_PASSWORD: hradmin123
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hradmin
      MINIO_ROOT_PASSWORD: hradmin123
    volumes:
      - ./data/minio:/data
    ports:
      - "9001:9001"
      - "9000:9000"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

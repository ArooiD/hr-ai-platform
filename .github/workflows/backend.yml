name: "CI: Backend"
run-name: "CI: Backend / ${{ github.ref_name }} / ${{ github.actor }}"

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
    paths:
      - 'backend/**'
      - 'docker/Dockerfile.backend'
      - '.github/workflows/backend.yml'
  pull_request:
    branches-ignore:
      - 'gh-readonly-queue/**'
    paths:
      - 'backend/**'
      - 'docker/Dockerfile.backend'
      - '.github/workflows/backend.yml'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hr_platform_test
          POSTGRES_USER: hradmin
          POSTGRES_PASSWORD: hradmin123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://hradmin:hradmin123@localhost:5432/hr_platform_test
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: hr_platform_test
          POSTGRES_USER: hradmin
          POSTGRES_PASSWORD: hradmin123
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: hradmin
          MINIO_SECRET_KEY: hradmin123
          MINIO_BUCKET: hr-content
          WEAVIATE_URL: http://localhost:8080
          OLLAMA_BASE_URL: http://localhost:11434
          AUTH_MODE: mock
          JWT_SECRET: hr-ai-dev-local-key
          DEMO_USER_LOGIN: depopova
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  build:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build image for local testing
        run: |
          docker build \
            -f docker/Dockerfile.backend \
            -t hr-backend-ci:${GITHUB_SHA::8} \
            .

      - name: Save image artifact
        run: |
          docker save hr-backend-ci:${GITHUB_SHA::8} | gzip > backend-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 1
